name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout private data repo
        uses: actions/checkout@v4
        with:
          repository: cities-analysis/cities-analysis-data
          ssh-key: ${{ secrets.DATA_DEPLOY_KEY }}
          path: private-data
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pandas
      - name: Build static data from private CSV files
        run: python scripts/build_data.py private-data
      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build
        env:
          CI: false
      - name: SPA fallback for deep links
        run: cp build/index.html build/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
